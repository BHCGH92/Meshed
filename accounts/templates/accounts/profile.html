{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto py-8 px-4">
    <h1 class="text-xl font-semibold mb-6">Profile</h1>

    <div class="flex items-center justify-between py-3 border-t border-b border-nav/10">
        <span>Dark mode</span>
        <button onclick="const html=document.documentElement; const next = html.dataset.theme === 'dark' ? 'light' : 'dark'; html.dataset.theme = next; localStorage.setItem('theme', next);" class="relative w-[38px] h-[22px] rounded-full bg-nav" aria-label="Toggle dark mode">
            <span class="absolute top-[2px] left-[2px] w-[18px] h-[18px] rounded-full bg-nav-text transition-transform dark:translate-x-[16px] flex items-center justify-center text-nav">
                <svg class="dark:hidden" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="hidden dark:block" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </span>
        </button>
    </div>
</div>
{% endblock %}
